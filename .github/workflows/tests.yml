name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # scipy 装在 [dev] 里 —— 它只在**测试**里出现,当独立裁判做交叉验证;
      # 运行时依赖只有 numpy。
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # 三个平台都跑,是因为这个库的价值有一半在"在受限环境里也能跑":
      # 临时目录、路径分隔、控制台编码都必须在三个平台上验过才算数。
      - name: 测试
        run: pytest tests/ -q

      # examples/old.json 与 new.json 是**提交进仓库**的,所以它们会随代码
      # 改动而悄悄失效:比如报告的逐题字段改名了、或者比较逻辑变了,
      # 而示例文件还是旧的。
      #
      # 两步:先生成一遍、确认与提交的副本**逐字节一致**
      # (说明生成器没漂移、也说明行尾是 LF);再照着 README 真跑一次那条命令。
      - name: 示例生成器是确定性的,且与提交的副本一致
        run: |
          python examples/make_examples.py
          git diff --exit-code -- examples/old.json examples/new.json

      # 这一步顺带验证了 Windows 上的控制台编码:报告里全是中文与 ✅/❌,
      # GBK 控制台如果不切成 UTF-8,这里会直接抛 UnicodeEncodeError。
      - name: README 里那条 compare 命令
        run: >-
          lev compare examples/old.json examples/new.json
          --metrics ok --label-a v1 --label-b v2
